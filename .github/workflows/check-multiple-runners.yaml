name: test the multiple runners
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run the tests'
        required: true
        default: 'dev'
        options:
          - dev
          - staging
          - prod
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  set-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.map.outputs.runner }}
    steps:
      - id: map
        run: |
          # Use the declared workflow input name 'env' (not 'environment')
          case "${{ inputs.env }}" in
            dev) echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT" ;;
            prod) echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT" ;;
            staging) echo "runner=pavan-self-hosted-test-qa-runner" >> "$GITHUB_OUTPUT" ;;
            *) echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT" ;;
          esac
  test:
    needs: set-runner
    runs-on: ${{ needs.set-runner.outputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running tests on ${{ needs.set-runner.outputs.runner }} environment"
          # Add your test commands here


      - name: Create index.html redirect
        shell: bash
        run: |
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=overview-features.html"></head><body>Redirecting...</body></html>' > src/cucumber-html-reports/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/cucumber-html-reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4